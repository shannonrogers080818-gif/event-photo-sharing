<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Logan's 30th 🎉</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fb;
      color: #222;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      margin: 45px 20px 10px;
    }

    h2 {
      font-size: 30px;
      margin-top: 45px;
    }

    p {
      font-size: 24px;
    }

    .card {
      background: white;
      max-width: 750px;
      margin: 40px auto;
      padding: 40px 25px;
      border-radius: 30px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    input[type="file"] {
      font-size: 18px;
      max-width: 100%;
      margin: 20px 0;
    }

    button {
      background: #222;
      color: white;
      border: none;
      padding: 16px 28px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 25px;
      font-size: 20px;
      font-weight: bold;
    }

    .gallery {
      max-width: 1000px;
      margin: 20px auto 60px;
      padding: 0 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .gallery img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 15px;
      background: #eee;
    }
  </style>
</head>

<body>

  <h1>🎉 Logan's 30th 🎉</h1>

  <p>Share your photos from the night! 📸</p>

  <div class="card">

    <h2>📷 Add your photos</h2>

    <input
      type="file"
      id="photoInput"
      accept="image/*"
      multiple
    >

    <br>

    <button id="uploadButton">
      Upload Photos
    </button>

    <div id="status"></div>

  </div>

  <h2>📸 Photos from the night</h2>

  <div id="gallery" class="gallery"></div>


  <script>

    /* =====================================================
       SUPABASE SETTINGS
       ===================================================== */

    const SUPABASE_URL =
      "https://gtruvxetsdvcsibknrk.supabase.co";

    /*
      IMPORTANT:
      Put your EXISTING Supabase anon/public key between
      the quotation marks below.

      It is the long key already in your old index.html.
    */

    const SUPABASE_ANON_KEY =
      "sb_publishable_8rDiAAZSF8go9F6f7NtRXA_NHbqiF3W";


    /* =====================================================
       YOUR BUCKET
       ===================================================== */

    const BUCKET_NAME = "events-photos";


    /* =====================================================
       CONNECT TO SUPABASE
       ===================================================== */

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    /* =====================================================
       PAGE ELEMENTS
       ===================================================== */

    const photoInput =
      document.getElementById("photoInput");

    const uploadButton =
      document.getElementById("uploadButton");

    const status =
      document.getElementById("status");

    const gallery =
      document.getElementById("gallery");


    /* =====================================================
       UPLOAD PHOTOS
       ===================================================== */

    uploadButton.addEventListener("click", async () => {

      const files = photoInput.files;

      if (!files || files.length === 0) {
        status.textContent = "Please choose a photo first.";
        return;
      }

      uploadButton.disabled = true;

      let uploaded = 0;

      status.textContent = "Uploading photos...";

      for (const file of files) {

        try {

          /*
            Give every photo a unique filename.
          */

          const fileName =
            `${Date.now()}-${crypto.randomUUID()}-${file.name}`;


          const { error } =
            await supabaseClient
              .storage
              .from(BUCKET_NAME)
              .upload(
                fileName,
                file,
                {
                  cacheControl: "3600",
                  upsert: false,
                  contentType: file.type
                }
              );


          if (error) {
            console.error("Upload error:", error);
            status.textContent =
              "Upload failed: " + error.message;
            uploadButton.disabled = false;
            return;
          }

          uploaded++;

        } catch (error) {

          console.error("Upload error:", error);

          status.textContent =
            "Upload failed: " + error.message;

          uploadButton.disabled = false;
          return;
        }
      }


      status.textContent =
        `🎉 ${uploaded} photo${uploaded === 1 ? "" : "s"} uploaded!`;


      photoInput.value = "";

      uploadButton.disabled = false;

      loadPhotos();

    });


    /* =====================================================
       LOAD PHOTOS
       ===================================================== */

    async function loadPhotos() {

      gallery.innerHTML = "";

      const { data, error } =
        await supabaseClient
          .storage
          .from(BUCKET_NAME)
          .list("", {
            limit: 100,
            sortBy: {
              column: "created_at",
              order: "desc"
            }
          });


      if (error) {

        console.error("Gallery error:", error);

        gallery.innerHTML =
          "<p>Unable to load photos.</p>";

        return;
      }


      if (!data || data.length === 0) {

        gallery.innerHTML =
          "<p>No photos yet — be the first! 📸</p>";

        return;
      }


      data.forEach(file => {

        /*
          Ignore folders.
        */

        if (!file.name) return;


        const { data: publicData } =
          supabaseClient
            .storage
            .from(BUCKET_NAME)
            .getPublicUrl(file.name);


        const img =
          document.createElement("img");


        img.src = publicData.publicUrl;

        img.alt = "Party photo";

        img.loading = "lazy";


        gallery.appendChild(img);

      });

    }


    /* =====================================================
       LOAD EXISTING PHOTOS WHEN PAGE OPENS
       ===================================================== */

    loadPhotos();

  </script>

</body>
</html>
