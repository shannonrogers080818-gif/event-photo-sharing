<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Logan's 30th 🎉</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #fff7fb;
      color: #222;
      text-align: center;
    }

    h1 {
      font-size: 52px;
      margin: 50px 20px 10px;
    }

    h2 {
      font-size: 32px;
      margin-top: 50px;
    }

    p {
      font-size: 25px;
    }

    .card {
      background: white;
      max-width: 700px;
      margin: 40px auto;
      padding: 40px 25px;
      border-radius: 30px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    input[type="file"] {
      font-size: 18px;
      margin: 20px;
      max-width: 90%;
    }

    button {
      background: #222;
      color: white;
      border: none;
      padding: 16px 28px;
      border-radius: 12px;
      font-size: 20px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 25px;
      font-size: 20px;
      font-weight: bold;
    }

    .gallery {
      max-width: 1000px;
      margin: 20px auto 60px;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .gallery img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 18px;
      background: #eee;
    }
  </style>
</head>

<body>

  <h1>🎉 Logan's 30th 🎉</h1>

  <p>Share your photos from the night! 📸</p>

  <div class="card">

    <h2>📷 Add your photos</h2>

    <input
      type="file"
      id="photoInput"
      accept="image/*"
      multiple
    >

    <br>

    <button id="uploadButton">
      Upload Photos
    </button>

    <div id="status"></div>

  </div>

  <h2>📸 Photos from the night</h2>

  <div id="gallery" class="gallery"></div>


  <script>

    /* =====================================================
       SUPABASE SETTINGS
       ===================================================== */

    const SUPABASE_URL =
      "https://gtruvxetsdvcsibknrk.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_8rDiAAZSF8go9F6f7NtRXA_NHbqiF3W";


    /* =====================================================
       DO NOT CHANGE ANYTHING BELOW THIS LINE
       ===================================================== */

    const BUCKET_NAME = "Events-photos";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    const photoInput =
      document.getElementById("photoInput");

    const uploadButton =
      document.getElementById("uploadButton");

    const status =
      document.getElementById("status");

    const gallery =
      document.getElementById("gallery");


    /* =====================================================
       UPLOAD PHOTOS
       ===================================================== */

    uploadButton.addEventListener("click", async () => {

      const files = Array.from(photoInput.files);

      if (files.length === 0) {
        status.textContent = "Please choose a photo first.";
        return;
      }

      uploadButton.disabled = true;

      let uploaded = 0;

      status.textContent =
        `Uploading ${files.length} photo${files.length === 1 ? "" : "s"}...`;

      for (const file of files) {

        try {

          const extension =
            file.name.split(".").pop();

          const safeName =
            file.name
              .replace(/[^a-zA-Z0-9.-]/g, "-");

          const fileName =
            `${Date.now()}-${Math.random()
              .toString(36)
              .substring(2, 8)}-${safeName}`;


          const { error } =
            await supabaseClient
              .storage
              .from(BUCKET_NAME)
              .upload(fileName, file, {
                cacheControl: "3600",
                upsert: false
              });


          if (error) {
            console.error("UPLOAD ERROR:", error);

            status.textContent =
              `Upload failed: ${error.message}`;

            uploadButton.disabled = false;

            return;
          }


          uploaded++;

          status.textContent =
            `🎉 ${uploaded} of ${files.length} uploaded!`;

        }

        catch (error) {

          console.error(error);

          status.textContent =
            `Upload failed: ${error.message}`;

          uploadButton.disabled = false;

          return;
        }
      }


      photoInput.value = "";

      status.textContent =
        `🎉 ${uploaded} photo${uploaded === 1 ? "" : "s"} uploaded successfully!`;

      uploadButton.disabled = false;

      loadPhotos();

    });


    /* =====================================================
       LOAD PHOTOS
       ===================================================== */

    async function loadPhotos() {

      gallery.innerHTML = "Loading photos...";


      const { data, error } =
        await supabaseClient
          .storage
          .from(BUCKET_NAME)
          .list("", {
            limit: 200,
            sortBy: {
              column: "created_at",
              order: "desc"
            }
          });


      if (error) {

        console.error("GALLERY ERROR:", error);

        gallery.innerHTML =
          `<p>Couldn't load the photos.</p>`;

        return;
      }


      gallery.innerHTML = "";


      if (!data || data.length === 0) {

        gallery.innerHTML =
          "<p>No photos uploaded yet 📸</p>";

        return;
      }


      data.forEach(file => {

        const {
          data: publicData
        } =
          supabaseClient
            .storage
            .from(BUCKET_NAME)
            .getPublicUrl(file.name);


        const img =
          document.createElement("img");

        img.src =
          publicData.publicUrl;

        img.alt =
          "Photo from Logan's 30th";

        img.loading =
          "lazy";


        gallery.appendChild(img);

      });

    }


    /* =====================================================
       LOAD GALLERY WHEN PAGE OPENS
       ===================================================== */

    loadPhotos();

  </script>

</body>
</html>
