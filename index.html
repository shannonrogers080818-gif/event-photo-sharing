<!DOCTYPE html>
<html>
<head>
  <title>Event Photo Sharing</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #f7f4ff;
    }

    h1 {
      font-size: 36px;
    }

    p {
      font-size: 18px;
    }

    .upload {
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 20px;
      max-width: 500px;
    }

    input {
      margin: 20px;
    }
  </style>
</head>

<body>

  <h1>📸 Event Photos</h1>

  <p>Share your photos from the event!</p>

  <div class="upload">
    <h2>Upload your photos</h2>

    <input type="file" accept="image/*" multiple>

    <p>Choose photos from your phone or computer.</p>
  </div>

</body>
</html>
